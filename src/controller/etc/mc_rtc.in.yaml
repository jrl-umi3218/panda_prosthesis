MainRobot:
  #module: Panda2LIRMM_2::Default::BoneTag::Femur
  module: Panda2LIRMM_FR1_Default_Table2_Calibrated::TKA::Femur
  name: panda_femur

# MainRobot:
#   module: Panda2LIRMMDefault::TAA::Tibia
#   name: panda_femur

# MainRobot:
#   module: Panda2LIRMMDefault::TSA::Glenoid
#   name: panda_femur

# MainRobot:
#   module: Panda7LIRMMDefault::TSA::Humerus
#   name: panda_tibia

# MainRobot: UR10::BoneTag::Femur
Enabled: PandaProsthesis
Timestep: 0.001
Log: true

# Franka specific configuration
Franka:
  ShowNetworkWarnings: false # If true (default), show warning messages about missing network data
  ControlMode: Velocity # Can be: Position/Velocity/Torque
  #ControlMode: Position # Can be: Position/Velocity/Torque
  panda_femur: # Robot on which the femur (positive knee) is attached
    ip: panda2 # IP of the robot
  panda_tibia: # Robot on which the tibia is attached
    ip: panda7
  # Actuated robots that are not controlled via mc_franka
  #ignored: [panda_femur, env/door, env/box]
  #ignored: [panda_tibia, env/door, env/box]


ControllerModulePaths: ["@MC_CONTROLLER_RUNTIME_INSTALL_PREFIX@"]
RobotModulePaths: ["@MC_ROBOTS_RUNTIME_INSTALL_PREFIX@"]
ObserverModulePaths: ["@MC_OBSERVERS_RUNTIME_INSTALL_PREFIX@"]
GlobalPluginPaths: ["@MC_PLUGINS_RUNTIME_INSTALL_PREFIX@"]
